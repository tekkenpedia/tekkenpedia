<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>TekkenPedia</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <link href="styles/styles.css" rel="stylesheet">
        <link rel="icon" type="image/png" href="images/favicon.png" />
    </head>
    <body>
        <div class="container">
                        <div class="row">
    <div class="col-8">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                                    <li
                        class="breadcrumb-item"
                                            >
                                                    <a href=".">TekkenPedia</a>
                                            </li>
                                    <li
                        class="breadcrumb-item active"
                         aria-current="page"                    >
                                                    Add move
                                            </li>
                            </ol>
        </nav>
    </div>
    <div class="col-4 text-end">
        <a href="./add-move.html" class="ms-2">Add move</a>
    </div>
</div>

            <div class="row">
                <div class="col-12">
                    <form>
                        <div class="row mb-3">
                            <label for="token" class="col-sm-2 col-form-label">Token</label>
                            <div class="col-sm-10">
                                <input class="form-control" id="token" placeholder="Example: github_pat_11..." required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="character" class="col-sm-2 col-form-label">Character</label>
                            <div class="col-sm-10">
                                <select id="character" class="form-select" required>
                                    <option value=""></option>
                                                                            <option value="alisa-bosconovitch">Alisa Bosconovitch</option>
                                                                            <option value="asuka-kazama">Asuka Kazama</option>
                                                                            <option value="azucena-milagros-ortiz-castillo">Azucena Milagros Ortiz Castillo</option>
                                                                            <option value="bryan-fury">Bryan Fury</option>
                                                                            <option value="claudio">Claudio</option>
                                                                            <option value="devil-jin">Devil Jin</option>
                                                                            <option value="eddy-gordo">Eddy Gordo</option>
                                                                            <option value="feng-wei">Feng Wei</option>
                                                                            <option value="hwoarang">Hwoarang</option>
                                                                            <option value="jack-8">Jack 8</option>
                                                                            <option value="jin-kazama">Jin Kazama</option>
                                                                            <option value="jun-kazama">Jun Kazama</option>
                                                                            <option value="kazuya-mishima">Kazuya Mishima</option>
                                                                            <option value="king">King</option>
                                                                            <option value="kuma">Kuma</option>
                                                                            <option value="lars-alexandersson">Lars Alexandersson</option>
                                                                            <option value="lee-chaolan">Lee Chaolan</option>
                                                                            <option value="leo-kliesen">Leo Kliesen</option>
                                                                            <option value="leroy-smith">Leroy Smith</option>
                                                                            <option value="lili">Lili</option>
                                                                            <option value="ling-xiaoyu">Ling Xiaoyu</option>
                                                                            <option value="marshall-law">Marshall Law</option>
                                                                            <option value="nina-williams">Nina Williams</option>
                                                                            <option value="panda">Panda</option>
                                                                            <option value="paul-phoenix">Paul Phoenix</option>
                                                                            <option value="raven">Raven</option>
                                                                            <option value="reina">Reina</option>
                                                                            <option value="sergei-dragunov">Sergei Dragunov</option>
                                                                            <option value="shaheen">Shaheen</option>
                                                                            <option value="steve-fox">Steve-Fox</option>
                                                                            <option value="victor-chevalier">Victor Chevalier</option>
                                                                            <option value="yoshimitsu">Yoshimitsu</option>
                                                                            <option value="zafina">Zafina</option>
                                                                    </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="inputs" class="col-sm-2 col-form-label">Inputs</label>
                            <div class="col-sm-10">
                                <input class="form-control" id="inputs" placeholder="Example: ws+1, qcf+2, hcf+1" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="property" class="col-sm-2 col-form-label">Property</label>
                            <div class="col-sm-10">
                                <select id="property" class="form-select">
                                    <option value=""></option>
                                                                            <option value="HIGH">HIGH</option>
                                                                            <option value="MIDDLE">MIDDLE</option>
                                                                            <option value="LOW">LOW</option>
                                                                    </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="col-sm-2 col-form-label" for="block-frames-min">On block frames min</label>
                            <div class="col-sm-4">
                                <input class="form-control" id="block-frames-min" required>
                            </div>
                            <label class="col-sm-2 col-form-label" for="block-frames-max">
                                On block frames max
                                <br>
                                (fill only if different from min)
                            </label>
                            <div class="col-sm-4">
                                <input class="form-control" id="block-frames-max">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12">
                                <button id="submit" class="btn btn-primary w-100">Add move</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="scripts/add-move.js"></script>
    </body>
</html>
