name: add-move
permissions:
    contents: write
    pull-requests: write
on:
    workflow_dispatch:
        inputs:
            character:
                description: 'Character slug'
                required: true
                type: string
            inputs:
                description: 'Inputs'
                required: true
                type: string
            property:
                description: 'Property (HIGH/MIDDLE/LOW)'
                required: true
                type: string
            blockFramesMin:
                description: 'Block frames min'
                required: true
                type: number
            blockFramesMax:
                description: 'Block frames max'
                required: false
                type: number
jobs:
    add-move:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            -
                name: Composer cache
                uses: actions/cache@v3
                with:
                    path: vendor
                    key: composer-${{ hashFiles('composer.json') }}
                    restore-keys: composer-${{ hashFiles('composer.json') }}
            - run: bin/ci/start
            - run: bin/dev/console move:add -- "${{ github.event.inputs.character }}" "${{ github.event.inputs.inputs }}" "${{ github.event.inputs.property }}" "${{ github.event.inputs.blockFramesMin }}" "${{ github.event.inputs.blockFramesMax }}"
            -
                name: Create pull request
                uses: peter-evans/create-pull-request@v7
                with:
                    base: master
                    branch: "add-move-${{ github.run_id }}"
                    title: "Add ${{ github.event.inputs.inputs }} for ${{ github.event.inputs.character }}"
                    body: ''
                    commit-message: "Add ${{ github.event.inputs.inputs }} for ${{ github.event.inputs.character }}"
