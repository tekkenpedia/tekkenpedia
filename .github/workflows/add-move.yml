name: add-move
permissions:
    contents: write
    pull-requests: write
on:
    workflow_dispatch:
        inputs:
            character:
                description: Character slug
                required: true
                type: string
            inputs:
                description: Inputs
                required: true
                type: string
            used:
                description: 'Used. Allowed values: RARELY, SITUATIONALLY, FREQUENTLY.'
                required: true
                type: string
            defenses:
                description: 'Defenses. Examples: PUNISH,POWER_CRUSH.'
                required: true
                type: string
            section:
                description: Section
                required: true
                type: string
            properties:
                description: 'Properties. Allowed values: HIGH, MIDDLE, SPECIAL_MIDDLE, LOW, SPECIAL_LOW'
                required: true
                type: string
            blockFramesMin:
                description: Block frames min
                required: true
                type: number
            blockFramesMax:
                description: Block frames max
                required: false
                type: number
jobs:
    add-move:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            -
                name: Composer cache
                uses: actions/cache@v5
                with:
                    path: vendor
                    key: composer-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ hashFiles('composer.lock') }}
            - run: bin/ci/start
            -
                name: Encode inputs
                id: encode_inputs
                run: echo "inputs=$(echo "${{ github.event.inputs.inputs }}" | sed 's/ /%20/g')" >> ${GITHUB_OUTPUT}
            - name: Run move:add
              id: add_move
              run: |
                set -o pipefail
                output=$(bin/ci/console move:add -- "${{ github.event.inputs.character }}" "${{ steps.encode_inputs.outputs.inputs }}" "${{ github.event.inputs.used }}" "${{ github.event.inputs.defenses }}" "${{ github.event.inputs.properties }}" "${{ github.event.inputs.blockFramesMin }}" "${{ github.event.inputs.blockFramesMax }}" 2>&1 || true)
                echo "move_output<<EOF" >> "$GITHUB_OUTPUT"
                echo "$output" >> "$GITHUB_OUTPUT"
                echo "EOF" >> "$GITHUB_OUTPUT"
            -
                name: Create pull request
                uses: peter-evans/create-pull-request@v7
                with:
                    base: master
                    branch: "add-move-${{ github.run_id }}"
                    title: "Add ${{ github.event.inputs.inputs }} for ${{ github.event.inputs.character }}"
                    body: |
                      Section: ${{ github.event.inputs.section }}
                      ${{ steps.add_move.outputs.move_output }}
                    commit-message: "Add ${{ github.event.inputs.inputs }} for ${{ github.event.inputs.character }}"
