name: ci
on: [push]
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            -
                name: Composer cache
                uses: actions/cache@v5
                with:
                    path: vendor
                    key: composer-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ hashFiles('composer.lock') }}
            - run: bin/ci/start
            - run: bin/ci/validate --theme=summary
